[project]
name = "promise-ledger"
version = "0.1.0"
description = "AI system that tracks and verifies promises made by company managements on earnings calls"
readme = "README.md"
authors = [
    { name = "Biswajit Gupta", email = "1999.biswajit.gupta@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.34.2",
]

[project.scripts]
promise-ledger = "promise_ledger:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
